[project]
name = "tingbox-hass"
version = "0.2.2"
description = "Unofficial Home Assistant custom integration for Tingbox speakers"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
  "homeassistant==2026.2.3",
  "paho-mqtt==2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
