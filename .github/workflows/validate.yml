name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant==2026.2.3 paho-mqtt==2.1.0 ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: PYTHONPATH="$PWD" python -m unittest discover -s tests -v
      - name: Release validation
        run: python scripts/validate_release.py

