name: Báo lỗi
description: Báo lỗi Tingbox integration mà không công khai dữ liệu nhạy cảm
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Không dán mật khẩu, token, MQTT credential/topic, serial đầy đủ, QR, số tài khoản, tên tài khoản hoặc raw API/MQTT payload.
  - type: input
    id: ha_version
    attributes:
      label: Phiên bản Home Assistant
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Phiên bản integration
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Khu vực lỗi
      options:
        - Đăng nhập/REST
        - MQTT
        - Độ sáng
        - Entity/automation
        - Cài đặt/HACS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Mô tả và cách tái hiện
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Xác nhận riêng tư
      options:
        - label: Tôi đã xóa credential, serial, QR, bank và dữ liệu cá nhân khỏi nội dung đính kèm.
          required: true

